<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Love</title>
<style>
  :root {
    --bg: #fff1f4;
    --glow: rgba(255, 60, 100, 0.28);
    --ring: #ff4d70;
    --heart-top: #ff6b88;
    --heart-bottom: #e3123f;
    --size: min(54vmin, 320px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15050c;
      --glow: rgba(255, 50, 90, 0.42);
      --ring: #ff5a7d;
      --heart-top: #ff5c7c;
      --heart-bottom: #d10f3a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #15050c;
    --glow: rgba(255, 50, 90, 0.42);
    --ring: #ff5a7d;
    --heart-top: #ff5c7c;
    --heart-bottom: #d10f3a;
  }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: var(--bg);
  }
  .stage {
    height: 100%;
    display: grid;
    place-items: center;
  }
  .stage > * { grid-area: 1 / 1; }

  .glow {
    width: calc(var(--size) * 2.2);
    height: calc(var(--size) * 2.2);
    border-radius: 50%;
    background: radial-gradient(circle, var(--glow) 0%, transparent 62%);
    animation: glow 1.6s ease-in-out infinite;
  }
  .heart {
    width: var(--size);
    height: auto;
    overflow: visible;
    transform-origin: 50% 55%;
    animation: beat 1.6s ease-in-out infinite;
    filter: drop-shadow(0 8px 22px var(--glow));
  }
  .ring {
    width: var(--size);
    height: auto;
    overflow: visible;
    transform-origin: 50% 55%;
    opacity: 0;
    animation: ripple 3.2s ease-out infinite;
  }
  .ring path { fill: none; stroke: var(--ring); stroke-width: 0.5; }
  .ring:nth-of-type(2) { animation-delay: 0s; }
  .ring:nth-of-type(3) { animation-delay: 1.07s; }
  .ring:nth-of-type(4) { animation-delay: 2.14s; }

  @keyframes beat {
    0%   { transform: scale(1); }
    14%  { transform: scale(1.14); }
    28%  { transform: scale(1.01); }
    42%  { transform: scale(1.1); }
    70%  { transform: scale(1); }
    100% { transform: scale(1); }
  }
  @keyframes glow {
    0%   { opacity: 0.55; transform: scale(0.92); }
    14%  { opacity: 1;    transform: scale(1.08); }
    28%  { opacity: 0.65; transform: scale(0.96); }
    42%  { opacity: 0.95; transform: scale(1.05); }
    70%, 100% { opacity: 0.55; transform: scale(0.92); }
  }
  @keyframes ripple {
    0%   { transform: scale(1);   opacity: 0.55; }
    100% { transform: scale(2.4); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .heart { animation-duration: 4s; }
    .glow  { animation-duration: 4s; }
    .ring  { animation: none; }
  }
</style>
</head>
<body>
  <main class="stage" aria-label="Hati yang berdetak">
    <div class="glow" aria-hidden="true"></div>

    <svg class="ring" viewBox="0 0 32 29.6" aria-hidden="true"><path d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/></svg>
    <svg class="ring" viewBox="0 0 32 29.6" aria-hidden="true"><path d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/></svg>
    <svg class="ring" viewBox="0 0 32 29.6" aria-hidden="true"><path d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/></svg>

    <svg class="heart" viewBox="0 0 32 29.6" role="img" aria-label="Love">
      <defs>
        <linearGradient id="hg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" style="stop-color: var(--heart-top)"/>
          <stop offset="1" style="stop-color: var(--heart-bottom)"/>
        </linearGradient>
      </defs>
      <path fill="url(#hg)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/>
    </svg>
  </main>
</body>
</html>
